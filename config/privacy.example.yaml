# 자비스 프라이버시·전송 정책 템플릿
# 재구축 개발 사본 위치: D:\Jarvis-v2-dev\config\privacy.yaml
#
# 이 파일은 네 개의 독립된 경로를 각각 통제한다 (PLAN 9.4절).
#   api          : 외부 LLM/검색 API로 나가는 내용
#   logs         : 이벤트·감사 로그에 기록되는 내용
#   tts          : 음성으로 낭독되는 내용
#   memory_write : 기억으로 저장되는 내용
# 한 경로에서 통과한 내용이 다른 경로에서 차단되는 것은 정상 동작이다.

schema_version: 1

# ---------------------------------------------------------------------------
# 외부 전송 정책
# ---------------------------------------------------------------------------
api_transmission:
  default: deny                 # 변경 불가. allow로 바꾸면 로더가 거부한다.

  # 외부 서비스별 활성 여부. online_tts는 D009 결정 전 false를 유지한다.
  services:
    llm: false                   # Ollama loopback은 외부 API 전송이 아니다.
    search_query: true
    online_tts: false

  allow:
    # 전송이 허용되는 기억 종류
    memory_kinds: [fact, correction, summary]
    # candidate(미확정) 기억은 기본적으로 전송하지 않는다
    allow_candidates: false
    # sensitivity가 아래 값 이하인 레코드만 전송
    max_sensitivity: normal      # normal | sensitive (secret은 어떤 경우도 불가)
    # 현재 세션의 사용자 발화는 전송 대상 (그렇지 않으면 대화가 불가능)
    current_turn: true
    history: true

  documents:
    # 문서 전송 등급 기본값. 명시적으로 올려야 API로 나간다.
    default_class: local_only    # local_only | api_allowed
    class_rules:
      - match: "docs\\public\\**"
        class: api_allowed
      - match: "docs\\private\\**"
        class: local_only
      - match: "**\\*.key"
        class: local_only
    # local_only 문서는 원문 대신 로컬에서 만든 발췌·요약도 보내지 않는다.
    allow_local_only_excerpt: false

  # 차단이 발생했을 때의 처리
  on_block: ask_user             # ask_user | deny | local_only
  # ask_user로 승인해도 secret 등급 탐지 결과는 전송되지 않는다.
  never_send_actions: [block]

# ---------------------------------------------------------------------------
# 탐지기
# action: mask = 대체 문자로 치환 후 통과 / block = 해당 경로 전송 자체를 차단
# label 은 로그와 UI에 표시되는 이름이며, 원문 조각은 절대 기록하지 않는다.
# ---------------------------------------------------------------------------
detectors:
  - id: openai_api_key
    label: "OpenAI 형식 API 키"
    pattern: "sk-[A-Za-z0-9_\\-]{20,}"
    action: block
    kind: secret

  - id: anthropic_api_key
    label: "Anthropic 형식 API 키"
    pattern: "sk-ant-[A-Za-z0-9_\\-]{20,}"
    action: block
    kind: secret

  - id: generic_bearer_token
    label: "Bearer 토큰"
    pattern: "(?i)bearer\\s+[A-Za-z0-9._\\-]{20,}"
    action: block
    kind: secret

  - id: secret_kv
    label: "키=값 형태의 비밀"
    pattern: "(?i)\\b(api[_\\-]?key|secret|password|passwd|pwd|token|private[_\\-]?key)\\b\\s*[:=]\\s*\\S{6,}"
    action: block
    kind: secret

  - id: private_key_block
    label: "개인키 블록"
    pattern: "-----BEGIN [A-Z ]*PRIVATE KEY-----"
    action: block
    kind: secret

  - id: aws_access_key
    label: "AWS 액세스 키"
    pattern: "\\bAKIA[0-9A-Z]{16}\\b"
    action: block
    kind: secret

  - id: krn_rrn
    label: "주민등록번호"
    pattern: "(?<!\\d)\\d{6}[-\\s]?[1-4]\\d{6}(?!\\d)"
    action: block
    kind: pii_high

  - id: card_number
    label: "카드번호"
    pattern: "(?<!\\d)(?:\\d{4}[-\\s]?){3}\\d{4}(?!\\d)"
    action: block
    kind: pii_high

  - id: kr_phone
    label: "휴대전화번호"
    pattern: "(?<!\\d)01[016789][-\\s]?\\d{3,4}[-\\s]?\\d{4}(?!\\d)"
    action: mask
    kind: pii

  - id: email
    label: "이메일 주소"
    pattern: "\\b[A-Za-z0-9._%+\\-]+@[A-Za-z0-9.\\-]+\\.[A-Za-z]{2,}\\b"
    action: mask
    kind: pii

  - id: windows_user_path
    label: "사용자 홈 경로"
    pattern: "(?i)C:\\\\Users\\\\[^\\\\\\s\"']+"
    action: mask
    kind: pii_low

mask:
  # 마스킹 시 대체 형식. 원문 길이를 노출하지 않도록 고정 문자열을 쓴다.
  replacement: "[{label}]"
  # 카드번호처럼 뒤 4자리 유지가 유용한 경우만 예외로 둔다.
  keep_tail:
    card_number: 0
    kr_phone: 0

# ---------------------------------------------------------------------------
# 경로별 적용 방식
# ---------------------------------------------------------------------------
outputs:
  api:
    apply_detectors: all
    # block 탐지가 하나라도 걸리면 api_transmission.on_block 정책을 따른다.
    on_block: inherit
    # LLM 메시지뿐 아니라 검색 query와 온라인 TTS 문자열에도 같은 전송 검사를 적용한다.
    purposes: [llm, search_query, online_tts]

  logs:
    apply_detectors: all
    # 감사 로그의 normalized_args 안 경로는 마스킹하지 않는다
    # (무엇이 실행됐는지 알 수 없는 감사 기록은 의미가 없다).
    exempt_fields: ["normalized_args.path", "changed_paths", "args_display"]
    mask_all_secret_kinds: true

  tts:
    apply_detectors: all
    # 아래 종류가 탐지되면 낭독 자체를 하지 않고 fallback_text로 대체한다.
    refuse_kinds: [secret, pii_high]
    # 아래 종류는 마스킹한 상태로 낭독한다(마스킹 문자열을 그대로 읽지 않고 label만 읽음).
    mask_kinds: [pii, pii_low]
    max_chars: 400
    fallback_text: "내용에 민감한 정보가 있어 화면으로 표시했습니다."

  memory_write:
    apply_detectors: all
    # 아래 종류가 탐지된 내용은 기억으로 저장하지 않는다 (PLAN Phase 2).
    refuse_kinds: [secret, pii_high]
    # 저장은 하지만 sensitivity를 올려 전송에서 제외할 종류
    mark_sensitive_kinds: [pii]

# ---------------------------------------------------------------------------
# 보존·삭제
# ---------------------------------------------------------------------------
retention:
  raw_days: 90                  # PLAN 5.4절
  raw_on_expire: compress       # delete | compress
  events_days: 180
  audit_days: 365               # 감사 기록은 더 길게 보존
  metrics_days: 180
  # 만료 처리는 앱 시작 시 1일 1회 수행하고 결과를 이벤트로 남긴다.
  run_on_startup: true

deletion:
  # /forget 은 본문·FTS·임베딩을 같은 트랜잭션에서 제거하고 tombstone을 남긴다.
  leave_tombstone: true
  # 백업 사본은 보존 기간 만료 또는 다음 전체 백업 시 함께 갱신된다.
  purge_from_backups: on_next_full_backup

# ---------------------------------------------------------------------------
# 백업
# ---------------------------------------------------------------------------
backup:
  enabled: true
  # backups\ 는 staging 전용. 실제 사본은 아래 target으로 옮긴다.
  staging_dir: "D:\\Jarvis-v2-dev\\backups"
  target: "<외부 드라이브 또는 별도 보안 위치 경로>"
  encryption: aes256            # 7z AES-256 또는 age
  # 암호는 파일에 적지 않는다. Windows 자격 증명 관리자에서 읽는다.
  passphrase_source: keyring
  schedule: weekly
  keep_copies: 4
  restore_test_interval: monthly  # PLAN 5.4절: 월 1회 복원 테스트
  include:
    - "memory\\jarvis.sqlite3"
    - "memory\\raw"
    - "config"
  exclude:
    - "logs"
    - "models"
    - "state\\quarantine"
